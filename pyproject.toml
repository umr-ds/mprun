[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mprun"
version = "0.0.1"
description = "Multi-Parameter Task Runner"
readme = "Readme.md"
requires-python = ">= 3.12"

authors = [
  {name = "Markus Sommer", email = "msommer@informatik.uni-marburg.de"}
]
maintainers = [
  {name = "Markus Sommer", email = "msommer@informatik.uni-marburg.de"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]

dependencies = ["pydantic"]

[dependency-groups]
server = ["uvicorn", "fastapi", "tinydb"]
client = ["typer", "httpx", "tomlkit"]
devel = [
    "pre-commit",
    "hatchling",
    "ruff",
    "ty",
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "openapi-python-client",
]

[project.urls]
Repository = "https://gitlab.uni-marburg.de/fb12/ag-freisleben/projects/mprun"

[project.scripts]
mprun_client = "mprun.client:app"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C",
    "D",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "ISC",
    "LOG",
    "N",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT"
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S", "PLR2004"]
"mprun/client.py" = ["FBT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ty.rules]
all = "error"
